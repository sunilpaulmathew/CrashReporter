plugins {
    id 'com.android.application'
}

android {
    namespace 'in.sunilpaulmathew.common.crashreporter.demo'
    compileSdkVersion 36

    defaultConfig {
        applicationId "in.sunilpaulmathew.common.crashreporter.demo"
        minSdkVersion 23
        targetSdk 36
        versionCode 1
        versionName "v0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation (project(":library"))
    implementation 'com.google.android.material:material:1.13.0'
}